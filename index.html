<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashioned from Bone</title>

<style>
:root{
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --top-h:110px;
  --bottom-h:90px;
  --pad-x:36px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font);
  background:#000;
  color:#fff;
}

a{ color:#fff; text-decoration:none; }
a:hover, a:focus-visible{ text-decoration:underline; outline:none; }

/* ================= TOPBAR ================= */
.topbar{
  position:fixed;
  inset:0 0 auto 0;
  padding:28px var(--pad-x);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  z-index:100;
  pointer-events:none;
}
.topbar *{pointer-events:auto;}

.brand img{
  height:120px;
  transition:.6s;
}
body.is-scrolled .brand img{
  height:58px;
  opacity:0;
  transform:translateY(-10px);
}

/* ================= NAV ================= */
.nav{
  display:flex;
  gap:34px;
  margin-top:6px;
}
.nav a{
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:1.8em;
  border-bottom:2px solid transparent;
}
.nav a:hover{ border-bottom-color:#fff; }

/* Burger */
.nav-toggle{
  display:none;
  width:44px;height:44px;
  background:#000;
  border:1px solid rgba(255,255,255,.25);
  border-radius:12px;
}
.nav-toggle span{
  display:block;
  height:2px;
  background:#fff;
  margin:6px 0;
}

/* Close */
.nav-close{
  display:none;
  position:absolute;
  top:18px;right:18px;
  width:46px;height:46px;
  background:#000;
  border:1px solid rgba(255,255,255,.25);
  border-radius:14px;
}

/* ================= FOOTER ================= */
.bottombar{
  position:fixed;
  bottom:0;left:0;right:0;
  padding:26px var(--pad-x);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  pointer-events:none;
}
.bottombar *{pointer-events:auto;}

.footer-links{
  display:flex;
  gap:28px;
}
.footer-links a{
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}

/* Social Icons */
.social{display:flex;gap:12px;}
.icon{
  width:36px;height:36px;
  display:grid;place-items:center;
  background:#000;
  border:1px solid rgba(255,255,255,.25);
  border-radius:10px;
}
.icon svg{width:18px;height:18px;fill:#fff;}

/* ================= PAGE ================= */
.page{
  padding-top:var(--top-h);
  padding-bottom:var(--bottom-h);
}
.section{
  min-height:100vh;
  padding:24px var(--pad-x);
}
.section__inner{max-width:1100px;margin:0 auto;}
.section h2,h1{
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.1em;
}

/* ================= HERO ================= */
.hero{padding:0;}
.hero__bg{
  position:absolute;inset:0;
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:1s;
}
.hero__bg.is-visible{opacity:1;}

/* ================= SECTIONS ================= */
.termine{background:#0b0b12;}
.kontakt{background:#0b120d;}
.impressum{background:#0a0a0a;font-size:12px;}

/* ================= CONTACT FORM ================= */
.contact-form{max-width:720px;margin-top:22px;}
.field{position:relative;margin:14px 0;}
.field input,.field textarea{
  width:100%;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  color:#fff;
  padding:18px 16px 14px;
}
.field textarea{min-height:160px;}
.field input::placeholder,.field textarea::placeholder{color:transparent;}
.field label{
  position:absolute;left:14px;top:16px;
  color:rgba(255,255,255,.7);
  transition:.15s;
}
.field input:focus+label,
.field textarea:focus+label,
.field input:not(:placeholder-shown)+label,
.field textarea:not(:placeholder-shown)+label{
  top:-10px;
  font-size:12px;
  background:#000;
  padding:0 8px;
}

.contact-submit{
  width:100%;
  margin-top:10px;
  padding:14px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25);
  border-radius:16px;
  font-weight:900;
  text-transform:uppercase;
}
.contact-submit:disabled{opacity:.4;cursor:not-allowed;}

.contact-success{
  display:none;
  margin-top:22px;
  padding:22px;
  border-radius:16px;
  background:rgba(120,255,180,.08);
  border:1px solid rgba(120,255,180,.35);
}

/* ================= IMPRESSUM ACCORDION ================= */
.impressum details{
  margin-top:18px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:16px;
}
.impressum summary{
  padding:14px 16px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}
.impressum summary::-webkit-details-marker{display:none;}
.impressum details[open] summary span{display:none;}
.impressum details[open] summary::after{
  content:"Schließen";
}
.impressum .arrow{
  width:18px;height:18px;
  transform:rotate(0deg);
  transition:.2s;
}
.impressum details[open] .arrow{transform:rotate(180deg);}
.impressum-content{padding:16px;}

/* ================= BACK TO TOP ================= */
.gotop{
  position:fixed;
  right:var(--pad-x);
  bottom:calc(var(--bottom-h) + 16px);
  width:46px;height:46px;
  background:#000;
  border:1px solid rgba(255,255,255,.25);
  border-radius:14px;
  display:grid;place-items:center;
  opacity:0;pointer-events:none;
}
.gotop.is-visible{opacity:1;pointer-events:auto;}

/* ================= MOBILE ================= */
@media(max-width:860px){
  :root{--top-h:90px;--bottom-h:120px;--pad-x:18px;}

  .nav-toggle{display:block;}

  .nav{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:24px;
    background:#000;
    z-index:110;
  }
  .nav.is-open{display:flex;}
  .nav-close{display:block;}

  /* Mobile Nav Reihenfolge */
  .nav a{font-size:18px;}

  /* Social Icons NUR im Mobile-Menü */
  .nav .social{
    margin-top:40px;
  }

  /* Footer mobil: KEIN Kontakt/Impressum */
  .footer-links{display:none;}
  .social{display:none;}

  .contact-form{max-width:100%;}
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="#top"><img src="images/logo.png" alt=""></a>

  <button class="nav-toggle" aria-label="Menü öffnen">
    <span></span><span></span><span></span>
  </button>

  <nav class="nav">
    <button class="nav-close">✕</button>
    <a href="#termine">Termine</a>
    <a href="#kontakt">Kontakt</a>
    <a href="#impressum">Impressum</a>

    <!-- Social Icons nur Mobile -->
    <div class="social">
      <a class="icon" href="https://instagram.com/fashionedfrombone" target="_blank">IG</a>
      <a class="icon" href="https://tiktok.com/@fashionedfrombone" target="_blank">TT</a>
      <a class="icon" href="https://fashionedfrombone.bandcamp.com" target="_blank">BC</a>
    </div>
  </nav>
</header>

<main id="top" class="page">
  <section class="section hero" id="hero">
    <div class="hero__bg is-visible"></div>
    <div class="hero__bg"></div>
  </section>

  <section id="termine" class="section termine">
    <div class="section__inner">
      <h2>Termine</h2>
      <p>24.01.2026 – MK BAR Luxemburg</p>
    </div>
  </section>

  <section id="kontakt" class="section kontakt">
    <div class="section__inner">
      <h2>Kontakt</h2>

      <form class="contact-form" id="contactForm" action="https://formspree.io/f/xyzrqznz" method="POST">
        <div class="field">
          <input type="text" name="name" placeholder=" ">
          <label>Name (optional)</label>
        </div>
        <div class="field">
          <input type="text" name="subject" required placeholder=" ">
          <label>Betreff</label>
        </div>
        <div class="field">
          <input type="email" name="email" required placeholder=" ">
          <label>E-Mail</label>
        </div>
        <div class="field">
          <textarea name="message" required placeholder=" "></textarea>
          <label>Nachricht</label>
        </div>

        <button class="contact-submit" disabled>Nachricht senden</button>

        <div class="contact-success" id="success">
          <strong>Danke für Ihre Anfrage!</strong>
        </div>
      </form>
    </div>
  </section>

  <section id="impressum" class="section impressum">
    <div class="section__inner">
      <h2>Impressum & Datenschutz</h2>

      <details>
        <summary>
          <span>Impressum & Datenschutzerklärung</span>
          <svg class="arrow" viewBox="0 0 24 24"><path fill="#fff" d="M12 15l-6-6h12z"/></svg>
        </summary>
        <div class="impressum-content">
          <p>Rafael Piechowiak – Saarbrücken</p>
        </div>
      </details>
    </div>
  </section>
</main>

<footer class="bottombar">
  <div class="footer-links">
    <a href="#kontakt">Kontakt</a>
    <a href="#impressum">Impressum</a>
  </div>

  <div class="social">
    <a class="icon" href="#">IG</a>
    <a class="icon" href="#">TT</a>
    <a class="icon" href="#">BC</a>
  </div>
</footer>

<button class="gotop">↑</button>

<script>
(() => {
  const nav=document.querySelector(".nav");
  const open=document.querySelector(".nav-toggle");
  const close=document.querySelector(".nav-close");

  open.onclick=()=>nav.classList.add("is-open");
  close.onclick=()=>nav.classList.remove("is-open");

  const form=document.getElementById("contactForm");
  const btn=form.querySelector("button");
  form.addEventListener("input",()=>{
    btn.disabled=!form.checkValidity();
  });
})();
</script>

</body>
</html>
